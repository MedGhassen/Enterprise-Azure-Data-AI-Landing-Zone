# Azure DevOps: Terraform validate, plan, manual approval, apply
# Use service connection with workload identity federation
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - '**.tf'
      - '**.tfvars'
      - 'pipelines/*.yml'

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - staging
      - prod

variables:
  terraformVersion: '1.5.0'

stages:
  - stage: Validate
    displayName: Validate
    jobs:
      - job: Validate
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)
          - checkout: self
          - script: terraform fmt -check -recursive -diff
            displayName: 'Terraform Format Check'
          - script: terraform init -backend=false
            displayName: 'Terraform Init'
          - script: terraform validate
            displayName: 'Terraform Validate'

  - stage: Plan
    displayName: Plan
    dependsOn: Validate
    jobs:
      - job: Plan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          - checkout: self
          # Set pipeline variables: BACKEND_RESOURCE_GROUP, BACKEND_STORAGE_ACCOUNT, BACKEND_CONTAINER (do not commit real values)
          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: '$(ARM_SERVICE_CONNECTION)'
              backendAzureRmResourceGroupName: '$(BACKEND_RESOURCE_GROUP)'
              backendAzureRmStorageAccountName: '$(BACKEND_STORAGE_ACCOUNT)'
              backendAzureRmContainerName: '$(BACKEND_CONTAINER)'
              backendAzureRmKey: 'data-ai-landing-zone-${{ parameters.environment }}.tfstate'
          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              commandOptions: '-var-file=environments/${{ parameters.environment }}.tfvars -out=tfplan'
              environmentServiceNameAzureRM: '$(ARM_SERVICE_CONNECTION)'

  - stage: Apply
    displayName: Apply
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Apply
        displayName: 'Apply (with approval)'
        environment: 'terraform-${{ parameters.environment }}'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)
                - checkout: self
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    backendServiceArm: '$(ARM_SERVICE_CONNECTION)'
                    backendAzureRmResourceGroupName: '$(BACKEND_RESOURCE_GROUP)'
                    backendAzureRmStorageAccountName: '$(BACKEND_STORAGE_ACCOUNT)'
                    backendAzureRmContainerName: '$(BACKEND_CONTAINER)'
                    backendAzureRmKey: 'data-ai-landing-zone-${{ parameters.environment }}.tfstate'
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    commandOptions: '-auto-approve -var-file=environments/${{ parameters.environment }}.tfvars'
                    environmentServiceNameAzureRM: '$(ARM_SERVICE_CONNECTION)'
