parameters:
  - name: terraformVersion
    type: string

steps:
  - script: |
      set -euo pipefail
      curl -sSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${{ parameters.terraformVersion }}/terraform_${{ parameters.terraformVersion }}_linux_amd64.zip"
      sudo unzip -o -q /tmp/terraform.zip -d /usr/local/bin
      terraform version
    displayName: Install Terraform ${{ parameters.terraformVersion }}
